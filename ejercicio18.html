<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ejercicio18</title>
</head>
<body>
<script>
let num1 = parseInt(prompt("Ingrese el primer número:"));
let num2 = parseInt(prompt("Ingrese el segundo número:"));

const calcularMayor = (numero1, numero2) => {
    if (numero1 > numero2) {
        document.write(`El número mayor es: ${numero1}`);
    } else if (numero2 > numero1) {
        document.write(`El número mayor es: ${numero2}`);
    } else {
        document.write(`Ambos números son iguales: ${numero1}`);
    }
};

calcularMayor(num1, num2);
</script>
</body>
</html>
