<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registro</title>
</head>
<body>
    <script>
        let entrada = prompt("Ingresa solo número:");
        let numero = parseInt(entrada);
        if (isNaN(numero)) {
            document.write("<h2>Error: '" + entrada + "' no es un número válido.</h2>");
        } else {
            if (numero % 2 == 0) {
                document.write("<h2>El número " + numero + " es PAR.</h2>");
            } else {
                document.write("<h2>El número " + numero + " es IMPAR.</h2>");
            }
        }
    </script>
</body>
</html>
